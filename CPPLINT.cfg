# Do not inherit unrelated user/workspace rules.
set noparent

# clang-format owns whitespace. Keep lexical bug checks that do not require a
# host compiler or modernize this legacy MWCC code. This is not an ABI checker.
filter=-,+build/endif_comment,+readability/multiline_comment,+readability/multiline_string,+readability/utf8,+readability/nul,+readability/nolint,+runtime/memset,+runtime/printf_format
